name: Auto Close Reviews

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  manage-review:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, '[REVIEW]') || contains(github.event.issue.labels.*.name, 'review') || contains(github.event.issue.labels.*.name, 'отзыв') || contains(github.event.issue.labels.*.name, 'feedback')
    steps:
      - name: Process, label and close review
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            // 1. Ensure label "review" exists
            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: 'review'
              });
            } catch (err) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: 'review',
                  color: '00e5ff',
                  description: 'Community reviews submitted from the official SAPatcher website'
                });
              } catch (createErr) {}
            }

            // 2. Add label "review" to issue
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: ['review']
              });
            } catch (err) {}

            // 3. Post a bilingual thank-you response (Russian + English)
            try {
              const commentBody = [
                '### 🎉 Спасибо за ваш отзыв! / Thank you for your review!',
                '',
                '🇷🇺 **Ваш отзыв успешно зарегистрирован!**',
                'Он опубликован и доступен в ленте на официальном сайте: [passatb5by.github.io/SAPatch](https://passatb5by.github.io/SAPatch/).',
                'Данный тикет автоматически закрыт для поддержания порядка в репозитории проекта.',
                '',
                '🇬🇧 **Your review has been successfully registered!**',
                'It is now published and visible live on our official website: [passatb5by.github.io/SAPatch](https://passatb5by.github.io/SAPatch/).',
                'This ticket has been automatically closed to keep the project issue tracker clean and organized.',
                '',
                '---',
                '🚀 *[PixelSmith Studio](https://pixelsmith.ru) — Building better GTA SA & Motion experiences*'
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody
              });
            } catch (err) {}

            // 4. Automatically close the issue
            try {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: 'closed'
              });
            } catch (err) {}
